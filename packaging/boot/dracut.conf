# Put gpu_unlock and its firmware in the initramfs and load it before udev
# can load nvidia. It does nothing unless gpu_unlock.targets= is on the
# kernel command line.
# dracut reads this directory in name order and keeps the order of the
# drivers it is told to force, so the 00- prefix is what puts gpu_unlock
# ahead of a nvidia some other drop-in forces (Bazzite ships 99-nvidia.conf).
force_drivers+=" gpu_unlock "
